<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDAGOGIA</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  /* Pastel palette */
  --bg:#fdf6f9;
  --surface:#ffffff;
  --surface2:#fce8f3;
  --surface3:#f8d7ea;
  --border:#f0c4df;
  --border2:#e8a8cc;

  --text:#3d2040;
  --text2:#7a5480;
  --text3:#b899c4;

  /* Main accent: dusty rose / mauve */
  --accent:#c2648a;
  --accent-bg:#fce8f3;
  --accent-text:#7a2a52;

  /* Sage green (success) */
  --green:#9b7cc4;
  --green-bg:#f0eafa;
  --green-text:#4a2880;

  /* Coral (alerts) */
  --red:#d96b82;
  --red-bg:#fdeef2;
  --red-text:#8b2040;

  /* Warm amber */
  --amber:#c4895a;
  --amber-bg:#fdf0e6;
  --amber-text:#7a4820;

  /* Lavender */
  --purple:#9b7cc4;
  --purple-bg:#f0eafa;
  --purple-text:#4a2880;

  /* Sky blue accent */
  --sky:#6aaad4;
  --sky-bg:#e8f4fc;

  --radius:18px;
  --radius-sm:12px;
  --radius-xs:8px;
  --font:'Quicksand',sans-serif;
  --font-serif:'Playfair Display',serif;
  --shadow:0 4px 20px rgba(194,100,138,0.10);
  --shadow-lg:0 12px 40px rgba(194,100,138,0.16);
  --shadow-card:0 2px 16px rgba(194,100,138,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 10% 20%, rgba(194,100,138,0.06) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(155,124,196,0.06) 0%, transparent 40%);
}

/* ══ TOPBAR ══ */
.topbar{
  background:linear-gradient(135deg,#c2648a 0%,#9b7cc4 100%);
  padding:0 1.75rem;height:64px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:50;
  box-shadow:0 4px 20px rgba(155,100,180,0.25);
}
.topbar-brand{display:flex;align-items:center;gap:12px;}
.topbar-brand .logo{
  width:38px;height:38px;background:rgba(255,255,255,0.25);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.3);
}
.topbar-brand .title-group{display:flex;flex-direction:column;}
.topbar-brand .main-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:#fff;font-weight:800;letter-spacing:0.14em;line-height:1.1;text-transform:uppercase;}
.topbar-brand .sub-title{font-size:10px;color:rgba(255,255,255,0.75);font-weight:500;letter-spacing:0.08em;text-transform:uppercase;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.online-dot{width:8px;height:8px;border-radius:50%;background:#b8f0d8;display:inline-block;box-shadow:0 0 0 3px rgba(184,240,216,0.3);}
.parcial-chip{background:rgba(255,255,255,0.22);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,0.3);backdrop-filter:blur(4px);letter-spacing:0.04em;}

.container{max-width:820px;margin:0 auto;padding:2rem 1.25rem;}

/* ══ MAIN TABS ══ */
.tabs{
  display:flex;gap:6px;margin-bottom:1.75rem;
  background:rgba(194,100,138,0.08);padding:5px;border-radius:22px;
  border:1px solid var(--border);
}
.tab{
  padding:9px 18px;border-radius:18px;font-size:13px;cursor:pointer;background:none;
  border:none;font-family:var(--font);color:var(--text2);transition:all 0.2s;
  display:flex;align-items:center;gap:6px;font-weight:600;flex:1;justify-content:center;
}
.tab.active{
  background:linear-gradient(135deg,var(--accent) 0%,var(--purple) 100%);
  color:#fff;box-shadow:0 4px 14px rgba(194,100,138,0.35);
}
.tab:hover:not(.active){background:rgba(194,100,138,0.1);color:var(--accent);}
.section{display:none;}.section.active{display:block;}

/* ══ CARDS ══ */
.card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:1.375rem;margin-bottom:1rem;
  box-shadow:var(--shadow-card);
}
.card-clickable{cursor:pointer;transition:all 0.2s;}
.card-clickable:hover{
  border-color:var(--accent);
  box-shadow:0 6px 24px rgba(194,100,138,0.16);
  transform:translateY(-2px);
}

/* ══ BADGES ══ */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:700;}
.badge-blue{background:var(--purple-bg);color:var(--purple-text);}
.badge-green{background:var(--green-bg);color:var(--green-text);}
.badge-red{background:var(--red-bg);color:var(--red-text);}
.badge-amber{background:var(--amber-bg);color:var(--amber-text);}
.badge-gray{background:var(--surface2);color:var(--text2);}

/* ══ FORMS ══ */
.form-group{margin-bottom:1rem;}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],textarea,select{
  width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;font-size:14px;font-family:var(--font);
  background:var(--surface);color:var(--text);resize:vertical;
  transition:all 0.2s;font-weight:500;
}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(194,100,138,0.12);
  background:#fff;
}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);cursor:pointer;margin-top:6px;font-weight:600;}
.checkbox-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}

/* ══ BUTTONS ══ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 20px;
  border:1.5px solid var(--border2);border-radius:var(--radius-sm);
  font-size:14px;cursor:pointer;background:var(--surface);color:var(--text2);
  font-family:var(--font);font-weight:700;transition:all 0.2s;letter-spacing:0.02em;
}
.btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent);}
.btn:active{transform:scale(0.96);}

.btn-primary{
  background:linear-gradient(135deg,var(--accent) 0%,#a84870 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(194,100,138,0.3);
}
.btn-primary:hover{background:linear-gradient(135deg,#b05578 0%,#903d60 100%);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(194,100,138,0.4);}

.btn-success{
  background:linear-gradient(135deg,#9b7cc4 0%,#c2648a 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(155,124,196,0.3);
}
.btn-success:hover{opacity:0.9;color:#fff;border-color:transparent;}

.btn-purple{
  background:linear-gradient(135deg,var(--purple) 0%,#7c5ea8 100%);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(155,124,196,0.3);
}

.btn-danger{color:var(--red-text);border-color:#f4c0ce;background:var(--red-bg);}
.btn-danger:hover{background:#fbd0db;border-color:var(--red);}

.btn-sm{padding:6px 13px;font-size:12px;border-radius:var(--radius-xs);}
.btn-full{width:100%;justify-content:center;}

/* ══ DIVIDER ══ */
.divider{border:none;border-top:1.5px dashed var(--border);margin:1.5rem 0;}

/* ══ BACK BUTTON ══ */
.back-btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;
  color:var(--text2);cursor:pointer;margin-bottom:1.5rem;background:none;
  border:none;font-family:var(--font);padding:0;transition:all 0.2s;font-weight:700;
}
.back-btn:hover{color:var(--accent);}

/* ══ QUESTION CARDS ══ */
.question-card h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.4;}
.question-card .preview{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.55;}
.card-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.detail-header h2{font-family:var(--font-serif);font-size:26px;color:var(--text);margin-bottom:8px;line-height:1.3;}
.detail-header .body-text{font-size:15px;color:var(--text2);line-height:1.65;}

/* ══ TIMER BAR ══ */
.timer-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:1rem;font-size:13px;font-weight:700;border:1.5px solid transparent;}
.timer-open{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple);}
.timer-closed{background:var(--red-bg);color:var(--red-text);border-color:var(--red);}
.timer-soon{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber);}

/* ══ REPLIES ══ */
.reply-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.25rem;margin-bottom:0.75rem;}
.reply-author{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.reply-text{font-size:14px;color:var(--text);line-height:1.65;font-weight:500;}
.reply-time{font-size:11px;color:var(--text3);margin-top:6px;font-weight:600;}
.reply-actions{display:flex;gap:8px;margin-top:10px;align-items:center;}
.nested-replies{margin-left:1.5rem;margin-top:0.75rem;padding-left:1rem;border-left:3px solid var(--border);}
.nested-reply{background:var(--surface2);border-radius:var(--radius-xs);padding:0.75rem;margin-bottom:0.5rem;}
.inline-reply-form{background:var(--surface2);border-radius:var(--radius-sm);padding:1rem;margin-top:0.75rem;display:none;border:1.5px dashed var(--border2);}
.inline-reply-form input,.inline-reply-form textarea{margin-bottom:8px;}
.inline-reply-form-actions{display:flex;gap:8px;}

/* ══ GRADE STATS ══ */
.grade-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;}
@media(max-width:560px){.grade-overview{grid-template-columns:1fr 1fr;}}
.grade-stat{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;
  box-shadow:var(--shadow-card);text-align:center;
  position:relative;overflow:hidden;
}
.grade-stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--accent),var(--purple));
}
.grade-stat .value{font-size:36px;font-weight:700;font-family:var(--font-serif);margin-bottom:4px;margin-top:4px;}
.grade-stat .label{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.grade-stat .sub{font-size:11px;color:var(--text3);margin-top:2px;font-weight:600;}

.criteria-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1.5px dashed var(--border);}
.criteria-row:last-child{border-bottom:none;}
.criteria-grade{font-size:24px;font-weight:700;min-width:52px;text-align:right;font-family:var(--font-serif);}
.criteria-grade.low{color:var(--red);}.criteria-grade.mid{color:var(--amber);}.criteria-grade.high{color:var(--purple);}.criteria-grade.none{color:var(--text3);}
.progress-bar-wrap{height:7px;background:var(--surface2);border-radius:10px;margin-top:7px;overflow:hidden;}
.progress-bar{height:100%;border-radius:10px;transition:width 0.9s ease;}

/* ══ PARCIAL TABS ══ */
.parcial-tabs{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
.parcial-tab{
  padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--border);
  font-family:var(--font);color:var(--text2);transition:all 0.2s;font-weight:700;
}
.parcial-tab.active{
  background:linear-gradient(135deg,var(--purple),#7c5ea8);
  color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(155,124,196,0.3);
}
.parcial-tab.active-current{
  background:linear-gradient(135deg,#9b7cc4,#c2648a);
  color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(155,124,196,0.3);
}
.parcial-tab:hover:not(.active):not(.active-current){border-color:var(--accent);color:var(--accent);}

/* ══ MOTIVATIONAL ══ */
.motivational{
  background:linear-gradient(135deg,#c2648a 0%,#9b7cc4 60%,#6aaad4 100%);
  color:#fff;border-radius:var(--radius);padding:1.5rem 1.75rem;margin-bottom:1rem;
  position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.motivational::before{content:'🌸';position:absolute;right:18px;top:14px;font-size:32px;opacity:0.45;}
.motivational::after{content:'✨';position:absolute;right:50px;bottom:12px;font-size:18px;opacity:0.3;}
.motivational p{font-size:15px;line-height:1.65;font-style:italic;font-weight:600;}
.motivational .mauthor{font-size:12px;margin-top:8px;opacity:0.82;font-weight:700;}

.motivational-attend{border-radius:var(--radius-sm);padding:1rem 1.375rem;margin-bottom:1rem;font-size:14px;line-height:1.6;font-weight:700;border:1.5px solid transparent;}
.attend-perfect{background:linear-gradient(135deg,#c2648a,#9b7cc4);color:#fff;box-shadow:0 4px 14px rgba(194,100,138,0.25);}
.attend-good{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple);}
.attend-warn{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber);}
.attend-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red);}
.attend-blocked{background:linear-gradient(135deg,#d96b82,#b84560);color:#fff;box-shadow:0 4px 14px rgba(217,107,130,0.3);}

/* ══ ADMIN PANEL ══ */
.admin-panel{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:1.375rem;margin-bottom:1.25rem;
  box-shadow:var(--shadow-card);
}
.admin-panel-title{
  font-size:11px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1rem;
  display:flex;align-items:center;gap:7px;
}
.q-manage{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--border);}
.q-manage:last-child{border-bottom:none;}

/* ══ STUDENT NAVIGATOR ══ */
.student-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,rgba(194,100,138,0.08),rgba(155,124,196,0.08));
  border:1.5px solid var(--accent);border-radius:var(--radius);
  padding:1rem 1.25rem;margin-bottom:1.25rem;
  box-shadow:0 0 0 4px rgba(194,100,138,0.08);
}
.student-nav-info{text-align:center;flex:1;}
.student-nav-info .sname{font-size:17px;font-weight:700;font-family:var(--font-serif);color:var(--accent);}
.student-nav-info .smat{font-size:12px;color:var(--text3);margin-top:2px;font-weight:600;}
.student-nav-dots{display:flex;gap:6px;justify-content:center;margin-top:9px;flex-wrap:wrap;}
.student-dot{width:9px;height:9px;border-radius:50%;background:var(--border2);cursor:pointer;transition:all 0.2s;}
.student-dot.active{background:var(--accent);transform:scale(1.5);box-shadow:0 0 0 3px rgba(194,100,138,0.2);}

/* ══ GRADE INPUTS ══ */
.grade-input-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.grade-input-wrap label{font-size:10px;color:var(--text2);font-weight:700;text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.grade-input-wrap input{width:66px;text-align:center;padding:8px 6px;font-size:14px;font-weight:700;border-radius:var(--radius-xs);}

/* ══ ATTEND BUTTONS ══ */
.attend-btn-group{display:flex;gap:5px;justify-content:center;}
.attend-btn{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;border:1.5px solid transparent;font-family:var(--font);
  transition:all 0.2s;opacity:0.38;
}
.attend-btn.sel{opacity:1;transform:scale(1.06);box-shadow:0 3px 10px rgba(0,0,0,0.12);}
.attend-btn.presente{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple);}
.attend-btn.falta{background:var(--red-bg);color:var(--red-text);border-color:var(--red);}
.attend-btn.justificante{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber);}

/* ══ SAVING INDICATOR ══ */
.saving-indicator{
  position:fixed;top:70px;right:16px;
  background:linear-gradient(135deg,#9b7cc4,#c2648a);
  color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;
  display:none;align-items:center;gap:7px;z-index:100;box-shadow:var(--shadow);
}
.saving-indicator.show{display:flex;}

/* ══ ATTEND PILLS ══ */
.attend-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.pill-p{background:var(--purple-bg);color:var(--purple-text);}
.pill-f{background:var(--red-bg);color:var(--red-text);}
.pill-j{background:var(--amber-bg);color:var(--amber-text);}
.pill-n{background:var(--surface2);color:var(--text3);}

/* ══ LOGIN ══ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;}
.login-box{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:2.75rem 2.25rem;max-width:400px;width:100%;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--sky));
}
.login-box .licon{
  width:58px;height:58px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  margin-bottom:1.25rem;font-size:26px;color:#fff;box-shadow:0 6px 18px rgba(194,100,138,0.3);
}
.login-box h2{font-family:var(--font-serif);font-size:26px;margin-bottom:6px;color:var(--text);}
.login-box p{font-size:14px;color:var(--text2);margin-bottom:1.75rem;line-height:1.55;font-weight:500;}

/* ══ ROLE BARS ══ */
.role-bar{display:none;align-items:center;gap:9px;padding:9px 16px;border-radius:var(--radius-sm);margin-bottom:1.25rem;font-size:13px;font-weight:700;border:1.5px solid transparent;}
.role-bar-teacher{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple);}
.role-bar-student{background:var(--purple-bg);color:var(--purple-text);border-color:var(--purple);}

/* ══ STEPPER ══ */
.stepper{display:flex;margin-bottom:1.5rem;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border);box-shadow:var(--shadow-card);}
.step{flex:1;padding:11px 8px;background:var(--surface2);text-align:center;font-size:12px;font-weight:700;color:var(--text3);border-right:1.5px solid var(--border);}
.step:last-child{border-right:none;}
.step.done{background:var(--purple-bg);color:var(--purple-text);}
.step.current{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;}
.step .step-label{font-size:10px;font-weight:600;margin-top:3px;opacity:0.85;}

/* ══ PARCIAL BADGE ══ */
.parcial-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.p1{background:#fce8f3;color:#7a2a52;}.p2{background:var(--purple-bg);color:var(--purple-text);}.pf{background:var(--amber-bg);color:var(--amber-text);}
.week-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:20px;border:1px solid var(--border);}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--accent),var(--purple));
  color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:200;
  white-space:nowrap;box-shadow:var(--shadow-lg);letter-spacing:0.02em;

// ══════════════════════════════════════════════════════

function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function getStatus(q){if(!q.closesAt)return'open';const d=q.closesAt-Date.now();if(d<=0)return'closed';if(d<3600000)return'soon';return'open';}
function timeLeft(ts){const d=ts-Date.now();if(d<=0)return'cerrado';const h=Math.floor(d/3600000);const m=Math.floor((d%3600000)/60000);if(h>24)return`${Math.floor(h/24)}d ${h%24}h`;if(h>0)return`${h}h ${m}m`;return`${m} min`;}
function formatDate(ts){return new Date(ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});}
function countReplies(qid){const r=replies[qid]||[];return r.reduce((a,r)=>a+1+(r.replies?r.replies.length:0),0);}
function firstNames(name){return name.split(' ').slice(-2).join(' ');}
function getPhrase(avg){let p;if(avg>=9)p=PHRASES.excellent;else if(avg>=7.5)p=PHRASES.good;else if(avg>=6)p=PHRASES.average;else p=PHRASES.low;return p[Math.floor(Math.random()*p.length)];}
function barColor(v){if(v===null||v===undefined)return'#ccc';if(v>=9)return'var(--purple)';if(v>=7)return'var(--amber)';return'var(--red)';}
function gradeColor(v){if(v===null||v===undefined)return'none';if(v>=9)return'high';if(v>=7)return'mid';return'low';}
function updateTopbar(){const p=PERIODS.find(p=>p.key===config.activePeriod)||PERIODS[0];document.getElementById('topbar-parcial').textContent=p.short;}
function getSessions(pkey){return sessions[pkey]||[];}

// Calcula faltas (solo 'F')
function calcFaltas(mat,pkey){
  const sess=getSessions(pkey);
  let faltas=0,justificantes=0,presentes=0;
  for(const s of sess){
    const v=(attendance[pkey]||{})[s.id]?.[mat];
    if(v==='F')faltas++;else if(v==='J')justificantes++;else if(v==='P')presentes++;
  }
  return{faltas,justificantes,presentes,total:sess.length};
}

// ── Calificaciones ──
// Para criterios semanales las calificaciones se indexan por SESSION ID
// Para criterios de parcial es un valor simple
function calcCriteriaGrade(mat,criterioKey,freq,pkey){
  const g=grades[mat]?.[pkey]?.[criterioKey];
  if(freq==='semana'){
    if(!g||typeof g!=='object')return null;
    const vals=Object.values(g).map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&v>=0);
    if(!vals.length)return null;
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  const v=parseFloat(g);return isNaN(v)?null:v;
}

function getActiveCriteria(pkey){
  // Rúbricas por parcial: config.rubrics[pkey]
  const rubricsPkey=(config.rubrics||{})[pkey]||{};
  if(Object.keys(rubricsPkey).length>0){
    return Object.entries(rubricsPkey).map(([key,r])=>({key,label:r.label,weight:r.weight,icon:r.icon||'ti-star',freq:r.freq}));
  }
  return CRITERIA;
}
function calcFinalGrade(mat,pkey){
  let total=0;let hasAny=false;
  for(const c of getActiveCriteria(pkey)){
    const g=calcCriteriaGrade(mat,c.key,c.freq,pkey);
    if(g!==null){total+=g*c.weight;hasAny=true;}
  }
  return hasAny?Math.min(10,total):null;
}
function calcGlobalGrade(mat){
  const vals=[calcFinalGrade(mat,'p1'),calcFinalGrade(mat,'p2'),calcFinalGrade(mat,'pf')].filter(v=>v!==null);
  if(!vals.length)return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

// ══════════════════════════════════════════════════════
// READ ALL INPUTS FROM DOM AND SAVE TO grades/attendance
// Called automatically when switching student or tab
// ══════════════════════════════════════════════════════
async function flushCurrentStudent(){
  const mat=ROSTER[teacherStudentIdx].mat;
  const ap=config.activePeriod;
  let changed=false;

  // ── Flush grades ──
  for(const c of CRITERIA){
    if(c.freq==='semana'){
      const sess=getSessions(ap);
      for(const s of sess){
        const inp=document.getElementById(`gi_${c.key}_${s.id}`);
        if(!inp)continue;
        const raw=inp.value.trim();
        const val=raw===''?null:parseFloat(raw);
        if(isNaN(val)&&raw!=='')continue;
        if(!grades[mat])grades[mat]={};
        if(!grades[mat][ap])grades[mat][ap]={};
        if(!grades[mat][ap][c.key]||typeof grades[mat][ap][c.key]!=='object')grades[mat][ap][c.key]={};
        const prev=grades[mat][ap][c.key][s.id];
        if(prev!==val){grades[mat][ap][c.key][s.id]=val;changed=true;}
      }
    } else {
      const inp=document.getElementById(`gi_${c.key}`);
      if(!inp)continue;
      const raw=inp.value.trim();
      const val=raw===''?null:parseFloat(raw);
      if(isNaN(val)&&raw!=='')continue;
      if(!grades[mat])grades[mat]={};
      if(!grades[mat][ap])grades[mat][ap]={};
      const prev=grades[mat][ap][c.key];
      if(prev!==val){grades[mat][ap][c.key]=val;changed=true;}
    }
  }

  // ── Flush attendance ──
  const sess=getSessions(ap);
  for(const s of sess){
    const selVal=document.querySelector(`input[name="att_${s.id}"]:checked`)?.value;
    if(!selVal)continue;
    if(!attendance[ap])attendance[ap]={};
    if(!attendance[ap][s.id])attendance[ap][s.id]={};
    const prev=attendance[ap][s.id][mat];
    if(prev!==selVal){attendance[ap][s.id][mat]=selVal;changed=true;}
  }

  if(changed){await saveAll();}
  return changed;
}

function renderQuestions(){
  const list=document.getElementById('questions-list');
  const detail=document.getElementById('question-detail');
  if(!list||!detail)return; // DOM no disponible (foro está dentro del dashboard)
  detail.style.display='none';list.style.display='block';
  const pqs=questions.filter(q=>q.period===config.activePeriod||!q.period);
  if(!pqs.length){list.innerHTML='<div class="empty-state"><i class="ti ti-message-off"></i><p>Aún no hay preguntas en este parcial.</p></div>';return;}
  const ap=PERIODS.find(p=>p.key===config.activePeriod);
  list.innerHTML=`<p style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.06em;">${ap?.label||''} · ${pqs.length} pregunta${pqs.length!==1?'s':''}</p>`+
  pqs.map(q=>{
    const i=questions.indexOf(q);
    const st=getStatus(q);const rc=countReplies(q.id);
    const sb=st==='closed'?`<span class="badge badge-red"><i class="ti ti-lock"></i> Cerrado</span>`:
      st==='soon'?`<span class="badge badge-amber"><i class="ti ti-clock"></i> ${timeLeft(q.closesAt)}</span>`:
      q.closesAt?`<span class="badge badge-blue"><i class="ti ti-clock"></i> ${timeLeft(q.closesAt)}</span>`:
      `<span class="badge badge-blue"><i class="ti ti-circle-check"></i> Abierto</span>`;
    return`<div class="card card-clickable question-card fade-up" onclick="openQuestion(${i})">
      <h3>${esc(q.title)}</h3>
      ${q.body?`<p class="preview">${esc(q.body)}</p>`:''}
      <div class="card-meta">${sb}<span class="badge badge-gray"><i class="ti ti-message"></i> ${rc}</span>${q.week?`<span class="week-tag">Ses ${q.week}</span>`:''}</div>
    </div>`;
  }).join('');
}

window.openQuestion=function(idx){
  const q=questions[idx];
  document.getElementById('questions-list').style.display='none';
  const detail=document.getElementById('question-detail');detail.style.display='block';
  const st=getStatus(q);const isClosed=st==='closed';const qReplies=replies[q.id]||[];
  const timerHtml=q.closesAt?`<div class="timer-bar ${isClosed?'timer-closed':st==='soon'?'timer-soon':'timer-open'}"><i class="ti ti-clock"></i>${isClosed?`Cerrado el ${formatDate(q.closesAt)}`:`Cierra el ${formatDate(q.closesAt)} · Quedan <strong>${timeLeft(q.closesAt)}</strong>`}</div>`:'';
  const authorVal=currentStudent?esc(firstNames(currentStudent.name)):'';
  const authorField=currentStudent?`<input type="text" id="reply-author" value="${authorVal}" readonly style="background:var(--surface2);color:var(--text2);">`:`<input type="text" id="reply-author" placeholder="Tu nombre o apodo">`;
  detail.innerHTML=`
    <button class="back-btn" onclick="renderQuestions()"><i class="ti ti-arrow-left"></i> Volver</button>
    ${timerHtml}
    <div class="detail-header"><h2>${esc(q.title)}</h2>${q.body?`<p class="body-text">${esc(q.body)}</p>`:''}</div>
    <hr class="divider">
    <p style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:1rem;">${qReplies.length} respuesta${qReplies.length!==1?'s':''}</p>
    <div id="replies-container">${renderRepliesHTML(qReplies,q.id,isClosed)}</div>
    ${!isClosed?`<hr class="divider">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:1rem;"><i class="ti ti-edit" style="margin-right:6px;"></i>Tu respuesta</h3>
      <div class="form-group"><label>Nombre</label>${authorField}</div>
      <div class="form-group"><label>Tu argumento</label><textarea id="reply-text" rows="4" placeholder="Escribe tu postura..."></textarea></div>
      <button class="btn btn-primary" onclick="submitReply('${q.id}')"><i class="ti ti-send"></i> Publicar</button>`
    :`<div style="background:var(--red-bg);color:var(--red-text);padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;"><i class="ti ti-lock"></i> Debate cerrado.</div>`}`;
};

function renderRepliesHTML(reps,qid,isClosed){
  if(!reps.length)return'<p style="font-size:14px;color:var(--text2);margin-bottom:1rem;">Sé el primero en responder.</p>';
  return reps.map((r,ri)=>{
    const nested=(r.replies||[]).map((nr,nri)=>`
      <div class="nested-reply">
        <div style="display:flex;justify-content:space-between;">
          <p class="reply-author"><i class="ti ti-corner-down-right" style="font-size:12px;"></i> ${esc(nr.author)}</p>
          ${isTeacher?`<button class="btn btn-danger btn-sm" onclick="deleteNestedReply('${qid}',${ri},${nri})"><i class="ti ti-trash"></i></button>`:''}
        </div>
        <p class="reply-text">${esc(nr.text)}</p><p class="reply-time">${nr.time}</p>
      </div>`).join('');
    const naa=currentStudent?`value="${esc(firstNames(currentStudent.name))}" readonly style="background:var(--surface2);"`:` placeholder="Tu nombre"`;
    return`<div class="reply-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <p class="reply-author"><i class="ti ti-user" style="font-size:13px;"></i> ${esc(r.author)}</p>
        ${isTeacher?`<button class="btn btn-danger btn-sm" onclick="deleteReply('${qid}',${ri})"><i class="ti ti-trash"></i></button>`:''}
      </div>
      <p class="reply-text">${esc(r.text)}</p><p class="reply-time">${r.time}</p>
      <div class="reply-actions">${!isClosed?`<button class="btn btn-sm" onclick="toggleReplyForm('${qid}',${ri})"><i class="ti ti-corner-down-right"></i> Responder a ${esc(r.author)}</button>`:''}</div>
      ${nested?`<div class="nested-replies">${nested}</div>`:''}
      ${!isClosed?`<div class="inline-reply-form" id="rf-${qid}-${ri}">
        <p style="font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:600;">Respondiendo a ${esc(r.author)}</p>
        <input type="text" id="rf-name-${qid}-${ri}" ${naa}>
        <textarea id="rf-text-${qid}-${ri}" rows="3" placeholder="Escribe tu respuesta..."></textarea>
        <div class="inline-reply-form-actions">
          <button class="btn btn-primary btn-sm" onclick="submitNestedReply('${qid}',${ri})"><i class="ti ti-send"></i> Enviar</button>
          <button class="btn btn-sm" onclick="toggleReplyForm('${qid}',${ri})">Cancelar</button>
        </div>
      </div>`:''}
    </div>`;
  }).join('');
}
window.toggleReplyForm=function(qid,ri){const f=document.getElementById(`rf-${qid}-${ri}`);const s=f.style.display!=='block';f.style.display=s?'block':'none';if(s)f.querySelector('input').focus();};
window.submitReply=async function(qid){
  const author=document.getElementById('reply-author').value.trim()||'Anónimo';
  const text=document.getElementById('reply-text').value.trim();
  if(!text){toast('Escribe tu argumento primero');return;}
  if(!replies[qid])replies[qid]=[];
  replies[qid].push({author,text,time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}),replies:[]});
  await saveAll();const idx=questions.findIndex(q=>q.id===qid);openQuestion(idx);
  showCelebration('🎯','¡Respuesta enviada!',currentStudent?`¡Gracias por participar, futura maestra ${firstNames(currentStudent.name)}! Tu voz enriquece este espacio de aprendizaje. 🌸`:'¡Gracias por tu participación! Cada aporte cuenta en nuestra comunidad de aprendizaje. 💜');
};
window.submitNestedReply=async function(qid,ri){
  const name=document.getElementById(`rf-name-${qid}-${ri}`).value.trim()||'Anónimo';
  const text=document.getElementById(`rf-text-${qid}-${ri}`).value.trim();
  if(!text){toast('Escribe tu respuesta');return;}
  if(!replies[qid][ri].replies)replies[qid][ri].replies=[];
  replies[qid][ri].replies.push({author:name,text,time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})});
  await saveAll();const idx=questions.findIndex(q=>q.id===qid);openQuestion(idx);
  showCelebration('💬','¡Aporte registrado!',currentStudent?`¡Qué buena respuesta, ${firstNames(currentStudent.name)}! El debate se enriquece con perspectivas como la tuya, futura pedagoga. 🎓`:'¡Excelente intercambio de ideas! El diálogo es la base de la buena enseñanza. 💫');
};
window.deleteReply=async function(qid,ri){replies[qid].splice(ri,1);await saveAll();const idx=questions.findIndex(q=>q.id===qid);openQuestion(idx);toast('Eliminado');};
window.deleteNestedReply=async function(qid,ri,nri){replies[qid][ri].replies.splice(nri,1);await saveAll();const idx=questions.findIndex(q=>q.id===qid);openQuestion(idx);toast('Eliminado');};

window.loginStudent=function(){
  const mat=document.getElementById('stu-mat').value.trim();
  const sel=document.getElementById('stu-name').value;
  const remember=document.getElementById('stu-remember').checked;
  const student=ROSTER.find(r=>r.mat===mat&&r.mat===sel);
  if(!student){toast('Matrícula o nombre incorrecto');return;}
  currentStudent=student;viewingParcial=config.activePeriod;
  if(remember)localStorage.setItem('foro-student',JSON.stringify(student));
  else localStorage.removeItem('foro-student');
  document.getElementById('role-bar-student').style.display='flex';
  document.getElementById('student-bar-name').textContent=`${firstNames(student.name)} · ${student.mat}`;
  // Saludo por hora
  const hr=new Date().getHours();
  const saludo=hr<12?'¡Buenos días':hr<19?'¡Buenas tardes':'¡Buenas noches';
  const fn2=firstNames(student.name);
  showCelebration('🌸',`${saludo}, ${fn2}!`,`Bienvenida a tu espacio de aprendizaje, futura pedagoga. Aquí encontrarás tus calificaciones, asistencia y los foros de debate de tu grupo. 💜`);
  renderStudentDashboard();
};
window.logoutStudent=function(){
  currentStudent=null;viewingParcial=null;localStorage.removeItem('foro-student');
  document.getElementById('role-bar-student').style.display='none';renderStudentLogin();
};
window.setViewingParcial=function(pkey){viewingParcial=pkey;renderStudentDashboard();};

function renderStudentDashboard(){
  document.getElementById('student-login-area').style.display='none';
  const dash=document.getElementById('student-dashboard');dash.style.display='block';
  const mat=currentStudent.mat;const fn=firstNames(currentStudent.name);
  if(!viewingParcial)viewingParcial=config.activePeriod;
  const vp=viewingParcial;
  const fg=calcFinalGrade(mat,vp);
  const phrase=getPhrase(fg||0);
  const {faltas,justificantes,presentes,total}=calcFaltas(mat,vp);
  const sinDerecho=faltas>=MAX_FALTAS;

  // ── Verificar si el docente ya configuró el curso ──
  const configured=config.periods&&(config.periods.p1?.weeks||config.periods.p2?.weeks);

  // ── Attend message ──
  let attendMsgHtml='';
  if(total>0){
    if(sinDerecho) attendMsgHtml=`<div class="motivational-attend attend-blocked"><i class="ti ti-ban" style="font-size:18px;vertical-align:-3px;margin-right:8px;"></i><strong>Sin derecho a examen.</strong> Has acumulado ${faltas} falta${faltas!==1?'s':''} no justificadas. Habla con tu docente a la brevedad para encontrar una solución. 💜</div>`;
    else if(faltas===0&&justificantes===0) attendMsgHtml=`<div class="motivational-attend attend-perfect"><i class="ti ti-star-filled" style="font-size:18px;vertical-align:-3px;margin-right:8px;"></i><strong>¡Asistencia perfecta!</strong> 🌟 Una futura maestra comprometida con su formación. ¡Así se construye una gran pedagoga, ${fn}!</div>`;
    else if(faltas===0&&justificantes>0) attendMsgHtml=`<div class="motivational-attend attend-good"><i class="ti ti-circle-check" style="font-size:18px;vertical-align:-3px;margin-right:8px;"></i><strong>Muy bien.</strong> Sin faltas injustificadas. ${justificantes} justificante${justificantes!==1?'s':''}. ¡Sigue siendo responsable!</div>`;
    else if(faltas===1) attendMsgHtml=`<div class="motivational-attend attend-warn"><i class="ti ti-alert-triangle" style="font-size:18px;vertical-align:-3px;margin-right:8px;"></i><strong>1 falta registrada.</strong> Aún estás a tiempo. ¡Cuida tu asistencia, ${fn}!</div>`;
    else attendMsgHtml=`<div class="motivational-attend attend-danger"><i class="ti ti-alert-circle" style="font-size:18px;vertical-align:-3px;margin-right:8px;"></i><strong>¡Atención! ${faltas} faltas.</strong> ${MAX_FALTAS-faltas===1?'Una falta más':'Pocas faltas'} y pierdes el derecho a examen. ¡Asiste puntualmente!</div>`;
  }

  // ── Asistencia ──
  const sess=getSessions(vp);
  const attendDetailHTML=sess.length?`<div class="card fade-up">
    <p class="admin-panel-title"><i class="ti ti-calendar-check"></i> Registro de asistencia · ${PERIODS.find(p=>p.key===vp)?.short}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${sess.map(s=>{
        const v=(attendance[vp]||{})[s.id]?.[mat]||'N';
        const pillCls=v==='P'?'pill-p':v==='F'?'pill-f':v==='J'?'pill-j':'pill-n';
        const pillLabel=v==='P'?'✓ Presente':v==='F'?'✗ Falta':v==='J'?'J Justificante':'—';
        return`<div style="text-align:center;min-width:80px;"><p style="font-size:11px;color:var(--text3);margin-bottom:5px;font-weight:500;">${esc(s.label)}</p><span class="attend-pill ${pillCls}">${pillLabel}</span></div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:12px;margin-top:1rem;flex-wrap:wrap;">
      <span style="font-size:13px;color:var(--purple-text);font-weight:600;"><i class="ti ti-circle-check"></i> ${presentes} presente${presentes!==1?'s':''}</span>
      <span style="font-size:13px;color:var(--red-text);font-weight:600;"><i class="ti ti-x"></i> ${faltas} falta${faltas!==1?'s':''}</span>
      <span style="font-size:13px;color:var(--amber-text);font-weight:600;"><i class="ti ti-file-check"></i> ${justificantes} justificante${justificantes!==1?'s':''}</span>
    </div>
  </div>`:'';

  // ── Stepper ──
  const periodOrder=['p1','p2','pf'];
  const stepperHTML=`<div class="stepper">${PERIODS.map(p=>{
    const curIdx=periodOrder.indexOf(config.activePeriod);
    const thisIdx=periodOrder.indexOf(p.key);
    const isDone=thisIdx<curIdx;
    const isCurrent=p.key===config.activePeriod;
    const pg=calcFinalGrade(mat,p.key);
    return`<div class="step ${isCurrent?'current':isDone?'done':''}">${p.short}<div class="step-label">${pg!==null?pg.toFixed(1):isCurrent?'En curso':'—'}</div></div>`;
  }).join('')}</div>`;

  // ── Parcial tabs ──
  const parcialTabsHTML=`<div class="parcial-tabs">${PERIODS.map(p=>{
    const isActive=p.key===vp;const isCurrent=p.key===config.activePeriod;
    return`<button class="parcial-tab ${isActive?(isCurrent?'active-current':'active'):''}" onclick="setViewingParcial('${p.key}')">${p.short}${isCurrent?' <span style="font-size:10px;opacity:0.8;">· Actual</span>':''}</button>`;
  }).join('')}</div>`;

  // ── Calificaciones (solo si docente configuró el curso) ──
  let gradesSection='';
  if(!configured){
    gradesSection=`<div class="card fade-up" style="text-align:center;padding:2rem;">
      <i class="ti ti-clock" style="font-size:36px;color:var(--text3);display:block;margin-bottom:12px;"></i>
      <p style="font-size:15px;font-weight:600;color:var(--text2);">Las calificaciones aún no están disponibles</p>
      <p style="font-size:13px;color:var(--text3);margin-top:6px;">Tu docente las publicará cuando configure el curso. ¡Sigue al pendiente! 🌸</p>
    </div>`;
  } else {
    // ── Rúbricas ──
    const criteriaToShow=getActiveCriteria(vp);

    const criteriaHTML=criteriaToShow.map(c=>{
      const g=calcCriteriaGrade(mat,c.key,c.freq,vp);
      const pct=g!==null?Math.min(100,(g/10)*100):0;
      let weekDetail='';
      if(c.freq==='semana'){
        const cg=grades[mat]?.[vp]?.[c.key]||{};
        const sess2=getSessions(vp);
        if(sess2.length){
          weekDetail=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">${sess2.map(s=>{
            const v=parseFloat(cg[s.id]);
            return`<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:${isNaN(v)?'var(--surface2)':'var(--accent-bg)'};color:${isNaN(v)?'var(--text3)':'var(--accent-text)'};">${esc(s.label)}: ${isNaN(v)?'—':v.toFixed(1)}</span>`;
          }).join('')}</div>`;
        }
      }
      return`<div class="criteria-row">
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;"><i class="ti ${c.icon||'ti-star'}" style="font-size:14px;vertical-align:-2px;margin-right:6px;color:var(--accent);"></i>${c.label}<span style="font-size:11px;color:var(--text3);margin-left:6px;">${Math.round(c.weight*100)}%</span></div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px;">${c.freq==='semana'?'Calificación por sesión':'Una vez por parcial'}</div>
          ${weekDetail}
          <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%;background:${barColor(g)};"></div></div>
        </div>
        <div class="criteria-grade ${gradeColor(g)}">${g!==null?g.toFixed(1):'—'}</div>
      </div>`;
    }).join('');

    const p1g=calcFinalGrade(mat,'p1');const p2g=calcFinalGrade(mat,'p2');const pfg=calcFinalGrade(mat,'pf');const globalGrade=calcGlobalGrade(mat);
    gradesSection=`
      ${stepperHTML}
      <div class="grade-overview fade-up">
        <div class="grade-stat">
          <div class="value" style="color:${barColor(fg)}">${fg!==null?fg.toFixed(1):'—'}</div>
          <div class="label">${PERIODS.find(p=>p.key===vp)?.short||'Parcial'}</div>
          <div class="sub">Promedio ponderado</div>
        </div>
        <div class="grade-stat">
          <div class="value" style="font-size:${sinDerecho?'16px':'34px'};color:${sinDerecho?'var(--red)':'var(--text)'};margin-top:${sinDerecho?'8px':'0'}">${sinDerecho?'Sin derecho<br>a examen':`${presentes}/${total}`}</div>
          <div class="label">Asistencias</div>
          <div class="sub">${faltas} falta${faltas!==1?'s':''} · ${justificantes} just.</div>
        </div>
        ${p1g!==null||p2g!==null||pfg!==null?`<div class="grade-stat"><div class="value" style="color:${barColor(globalGrade)}">${globalGrade!==null?globalGrade.toFixed(1):'—'}</div><div class="label">Promedio global</div><div class="sub">Parciales completados</div></div>`
        :`<div class="grade-stat"><div class="value" style="font-size:20px;color:var(--accent);margin-top:8px;">${fn}</div><div class="label">Alumna</div><div class="sub">${mat}</div></div>`}
      </div>
      ${parcialTabsHTML}
      <div class="card fade-up">
        <p class="admin-panel-title"><i class="ti ti-chart-bar"></i> Calificaciones · ${PERIODS.find(p=>p.key===vp)?.label}</p>
        ${criteriaHTML}
      </div>
      ${attendDetailHTML}`;
  }

  // ── Sub-tabs del dashboard (Inicio / Foro / EVA) ──
  const studentSubTabsHTML=`<div style="display:flex;gap:4px;margin-bottom:1.5rem;background:rgba(194,100,138,0.08);padding:4px;border-radius:22px;border:1px solid var(--border);flex-wrap:wrap;">
    <button class="tab ${currentStudentTab==='home'?'active':''}" style="flex:1;min-width:70px;" onclick="setStudentTab('home')"><i class="ti ti-layout-dashboard"></i> Progreso</button>

function renderTeacherLogin(){
  document.getElementById('teacher-login-area').style.display='block';
  document.getElementById('teacher-panel').style.display='none';
  // Leer sesión recordada (solo si se marcó la opción)
  const saved=localStorage.getItem('foro-teacher-session');
  const sf=saved?JSON.parse(saved):{};
  document.getElementById('teacher-login-area').innerHTML=`
    <div class="login-wrap"><div class="login-box fade-up">
      <div class="licon"><i class="ti ti-shield-check"></i></div>
      <h2>Acceso Docente</h2>
      <p>Panel exclusivo del docente. Gestiona calificaciones, asistencia y foro.</p>
      <div class="form-group">
        <label>Usuario</label>
        <div style="display:flex;align-items:center;border:1.5px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);">
          <input type="text" id="teacher-user" placeholder="usuario" value="${sf.user||''}"
            style="border:none;border-radius:0;flex:1;padding:10px 13px;background:transparent;"
            onkeydown="if(event.key==='Enter')document.getElementById('teacher-pwd').focus()"
            oninput="autocompleteDomain(this)">
          <span style="padding:10px 12px 10px 4px;font-size:13px;color:var(--text3);font-weight:600;white-space:nowrap;" id="domain-suffix">${TEACHER_DOMAIN}</span>
        </div>
      </div>
      <div class="form-group"><label>Contraseña</label>
        <input type="password" id="teacher-pwd" placeholder="Contraseña" value="${sf.pass||''}"
          onkeydown="if(event.key==='Enter')checkPass()">
      </div>
      <label class="checkbox-row" style="margin-bottom:1.25rem;">
        <input type="checkbox" id="teacher-remember" ${sf.user?'checked':''}>
        Recordar sesión en este dispositivo
      </label>
      <button class="btn btn-primary btn-full" onclick="checkPass()"><i class="ti ti-login"></i> Entrar</button>
    </div></div>`;
}

window.autocompleteDomain=function(inp){
  // Si el usuario escribe el dominio completo, limpiar el sufijo visual
  const suffix=document.getElementById('domain-suffix');
  if(inp.value.includes('@')){
    if(suffix)suffix.style.opacity='0.3';
  } else {
    if(suffix)suffix.style.opacity='1';
  }
};
window.checkPass=async function(){
  const userRaw=document.getElementById('teacher-user').value.trim();
  const email=userRaw.includes('@')?userRaw:userRaw+TEACHER_DOMAIN;
  const password=document.getElementById('teacher-pwd').value;
  const remember=document.getElementById('teacher-remember')?.checked;
  if(!email||!password){toast('Ingresa usuario y contraseña');return;}
  const btn=document.querySelector('#teacher-login-area .btn-primary');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Verificando...';}
  try{
    // Login con Firebase Auth SDK — el token queda activo para todas las escrituras
    const cred=await signInWithEmailAndPassword(auth,email,password);
    const user=cred.user;
    // Verificar dominio @master.blackai.com
    if(!user.email.toLowerCase().endsWith(TEACHER_DOMAIN)){
      await signOut(auth);
      toast('Solo cuentas @master.blackai.com pueden acceder');
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Entrar';}
      return;
    }
    // Guardar sesión SOLO si se marcó recordar
    if(remember){
      localStorage.setItem('foro-teacher-session',JSON.stringify({user:userRaw.replace(TEACHER_DOMAIN,'').replace('@',''),pass:password}));
    } else {
      localStorage.removeItem('foro-teacher-session');
    }
    window._teacherEmail=user.email;
    isTeacher=true;
    document.getElementById('role-bar-teacher').style.display='flex';
    renderTeacherSection();
    toast('¡Bienvenido/a! 🌸');
  }catch(err){
    console.error('Auth error:',err);
    const code=err.code||'';
    const friendly=code.includes('wrong-password')||code.includes('user-not-found')||code.includes('invalid-credential')
      ?'Usuario o contraseña incorrectos'
      :code.includes('too-many-requests')
      ?'Demasiados intentos. Espera unos minutos.'
      :'Error de conexión. Intenta de nuevo.';
    toast(friendly);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Entrar';}
  }
};
window.logoutTeacher=async function(){
  isTeacher=false;
  window._teacherEmail=null;
  try{await signOut(auth);}catch(e){}
  document.getElementById('role-bar-teacher').style.display='none';
  renderTeacherLogin();
  showTab('teacher');
};

window.addSession=async function(){
  const ap=config.activePeriod;
  if(!sessions[ap])sessions[ap]=[];
  const n=sessions[ap].length+1;
  const labelInput=document.getElementById('sess-label');
  // Auto-generate label if empty
  const today=new Date().toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
  const label=labelInput?.value.trim()||`Sesión ${n} · ${today}`;
  sessions[ap].push({id:'s'+Date.now(),label});
  if(labelInput)labelInput.value='';
  await saveAll();renderTeacherPanel();toast(`Sesión "${label}" agregada`);
};
window.deleteSession=async function(sessId,si){
  const ap=config.activePeriod;
  sessions[ap].splice(si,1);
  if(attendance[ap]&&attendance[ap][sessId])delete attendance[ap][sessId];
  // Remove grade entries for this session
  for(const mat of ROSTER.map(r=>r.mat)){
    for(const c of CRITERIA.filter(c=>c.freq==='semana')){
      if(grades[mat]?.[ap]?.[c.key]?.[sessId]!==undefined)delete grades[mat][ap][c.key][sessId];
    }
  }
  await saveAll();renderTeacherPanel();toast('Sesión eliminada');
};

window.addQuestion=async function(){
  const title=document.getElementById('new-q-title').value.trim();
  const body=document.getElementById('new-q-body').value.trim();
  const closesVal=document.getElementById('new-q-closes').value;
  const week=document.getElementById('new-q-week').value;
  const period=document.getElementById('new-q-period').value;
  if(!title){toast('Escribe la pregunta primero');return;}
  const q={id:'q'+Date.now(),title,body,date:new Date().toLocaleDateString('es-MX'),week:parseInt(week),period};
  if(closesVal)q.closesAt=new Date(closesVal).getTime();
  questions.unshift(q);await saveAll();renderTeacherPanel();toast('¡Pregunta publicada!');
};
window.deleteQuestion=async function(idx){
  const qid=questions[idx].id;questions.splice(idx,1);delete replies[qid];
  await saveAll();renderTeacherPanel();toast('Pregunta eliminada');
};
window.reopenQuestion=async function(idx){
  delete questions[idx].closesAt;await saveAll();renderTeacherPanel();toast('Reabierta');
};

window.hardResetData=async function(){
  if(!confirm('⚠️ ¿Borrar TODOS los datos del grupo?\n\nEsto eliminará permanentemente:\n- Calificaciones de todos los parciales\n- Asistencias de todas las sesiones\n- Sesiones registradas\n\nEsta acción no se puede deshacer.'))return;
  if(!confirm('Segunda confirmación: ¿Estás segura? Se borrarán todos los datos.'))return;
  grades={};attendance={};sessions={};
  await saveAll();
  renderTeacherPanel();
  toast('✓ Todos los datos han sido borrados');
};

window.saveConfig=async function(){
  const newActive=document.getElementById('cfg-active').value;
  const newP1=parseInt(document.getElementById('cfg-p1-weeks').value)||8;
  const newP2=parseInt(document.getElementById('cfg-p2-weeks').value)||8;
  const newPf=parseInt(document.getElementById('cfg-pf-weeks').value)||0;
  // Detectar si cambió algo que justifique limpiar datos
  const changed=
    newActive!==config.activePeriod||
    newP1!==(config.periods?.p1?.weeks||8)||
    newP2!==(config.periods?.p2?.weeks||8)||
    newPf!==(config.periods?.pf?.weeks||0);
  if(changed){
    const ok=confirm('¿Guardar la nueva configuración?\n\nAtención: esto limpiará todas las calificaciones y asistencias registradas para comenzar de cero con la nueva configuración.');
    if(!ok)return;
    grades={};
    attendance={};
    sessions={};
  }
  config.activePeriod=newActive;
  config.periods={
    p1:{weeks:newP1},
    p2:{weeks:newP2},
    pf:{weeks:newPf}
  };
  await saveAll();updateTopbar();renderTeacherPanel();toast('✓ Configuración guardada. Datos reiniciados.');
};

window.setRubricEditKey=function(pkey){
  config._rubricEditKey=pkey;
  renderTeacherPanel();
};

window.saveRubrics=async function(){
  const editKey=config._rubricEditKey||config.activePeriod;
  const existing=(config.rubrics||{})[editKey]||{};
  const keys=Object.keys(existing).length>0?Object.keys(existing):CRITERIA.map(c=>c.key);
  const rubrics={};
  let totalWeight=0;
  for(const key of keys){
    const label=document.getElementById(`rb_label_${key}`)?.value.trim()||key;
    const weight=parseFloat(document.getElementById(`rb_weight_${key}`)?.value)||0;
    const freq=document.getElementById(`rb_freq_${key}`)?.value||'parcial';
    const icon=document.getElementById(`rb_icon_${key}`)?.value||'ti-star';
    rubrics[key]={label,weight:weight/100,freq,icon};
    totalWeight+=weight;
  }
  const msg=document.getElementById('rubric-sum-msg');
  if(Math.abs(totalWeight-100)>0.5){
    if(msg){msg.textContent=`⚠️ La suma es ${totalWeight}%. Debe ser 100%.`;msg.style.color='var(--red-text)';}
    toast('La suma de pesos debe ser 100%');return;
  }
  if(msg){msg.textContent='✓ Suma correcta: 100%';msg.style.color='var(--purple-text)';}
  if(!config.rubrics)config.rubrics={};
  config.rubrics[editKey]=rubrics;
  await saveAll();toast(`Rúbricas del ${PERIODS.find(p=>p.key===editKey)?.short||editKey} guardadas ✓`);renderTeacherPanel();
};

window.resetRubrics=async function(){
  const editKey=config._rubricEditKey||config.activePeriod;
  if(!confirm(`¿Restaurar las rúbricas predeterminadas para ${PERIODS.find(p=>p.key===editKey)?.short||editKey}?`))return;
  if(!config.rubrics)config.rubrics={};
  delete config.rubrics[editKey];
  await saveAll();renderTeacherPanel();toast('Rúbricas restauradas');
};


window.openWebQuest=async function(){
  const btn=document.getElementById('webquest-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Abriendo...';}
  try{
    const user=auth.currentUser;
    if(user){
      const idToken=await user.getIdToken(true);
      window.open(`${WEBQUEST_URL}?token=${encodeURIComponent(idToken)}`,'_blank');
    } else {
      window.open(WEBQUEST_URL,'_blank');
    }
  }catch(err){
    console.error('SSO error:',err);
    window.open(WEBQUEST_URL,'_blank');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-external-link"></i> Entrar a WebQuest';}
  }
};

    <div id="replies-container">${renderRepliesHTML(qReplies,q.id,isClosed)}</div>
    ${!isClosed?`<hr class="divider">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:1rem;"><i class="ti ti-edit" style="margin-right:6px;"></i>Tu aportación</h3>
      <div class="form-group"><label>Tu nombre</label>${authorField}</div>
      <div class="form-group"><label>Tu argumento</label><textarea id="reply-text" rows="4" placeholder="Comparte tu perspectiva como futura pedagoga..."></textarea></div>
      <button class="btn btn-primary" onclick="submitStudentReply('${q.id}')"><i class="ti ti-send"></i> Publicar mi aportación</button>`
    :`<div style="background:var(--red-bg);color:var(--red-text);padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;"><i class="ti ti-lock"></i> Este debate está cerrado.</div>`}`;
};

window.backToStudentForum=function(){
  const list=document.getElementById('student-questions-list');
  const detail=document.getElementById('student-question-detail');
  if(list)list.style.display='block';
  if(detail)detail.style.display='none';
};

window.submitStudentReply=async function(qid){
  const author=document.getElementById('reply-author').value.trim()||'Anónima';
  const text=document.getElementById('reply-text').value.trim();
  if(!text){toast('Escribe tu argumento primero');return;}
  if(!replies[qid])replies[qid]=[];
  replies[qid].push({author,text,time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}),replies:[]});
  await saveAll();
  const idx=questions.findIndex(q=>q.id===qid);
  openStudentQuestion(idx);
  const fn2=currentStudent?firstNames(currentStudent.name):'';
  showCelebration('🎯','¡Respuesta enviada!',`¡Gracias por tu aportación, futura maestra ${fn2}! Tu voz enriquece este espacio de aprendizaje. 🌸`);
};

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
const saved=localStorage.getItem('foro-student');
if(saved){
  try{
    const s=JSON.parse(saved);
    const match=ROSTER.find(r=>r.mat===s.mat&&r.name===s.name);
    if(match){
      currentStudent=match;viewingParcial=config.activePeriod;
      document.getElementById('role-bar-student').style.display='flex';
      document.getElementById('student-bar-name').textContent=`${firstNames(match.name)} · ${match.mat}`;
    }
  }catch(e){}
}
// Mostrar login de alumnas inmediatamente al cargar
renderStudentLogin();
document.getElementById('students-section').classList.add('active');
document.getElementById('teacher-section').classList.remove('active');
document.getElementById('tab-students')?.classList.add('active');
document.querySelectorAll('.tabs .tab').forEach((t,i)=>{if(i!==0)t.classList.remove('active');});

loadAll().then(()=>{
  startListener();
  // Si hay sesión guardada, mostrar dashboard; si no, el login ya está visible
  if(currentStudent){renderStudentDashboard();}
  else{renderStudentLogin();}
});
setInterval(()=>{
  // Solo actualizar si el alumno NO está dentro de una pregunta del foro
  const insideQ=document.getElementById('student-question-detail')?.style.display!=='none';
  if(!insideQ&&currentStudent&&document.getElementById('students-section').classList.contains('active')){
    renderStudentDashboard();
  }
},30000);
</script>
</body>
</html>
